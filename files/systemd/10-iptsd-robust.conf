# Drop-in for iptsd@.service
# Install as /etc/systemd/system/iptsd@.service.d/10-iptsd-robust.conf
#
# Two reasons:
#
# 1. The shipped unit has StopWhenUnneeded=yes. Reloading udev rules - which
#    pacman does on nearly every package install - briefly drops the
#    SYSTEMD_WANTS binding, StopWhenUnneeded fires, and iptsd stays dead.
#    Symptom: the touchscreen silently stops working after an unrelated
#    update, and the IPTSD Virtual * input devices disappear.
#
# 2. linux-surface has a known bug where the touchscreen stays dead after
#    detaching the display, and restarting iptsd fixes it. Restart=always
#    makes that happen by itself.
#
# BindsTo=%i.device is left alone: when the device really goes away, the
# service still stops correctly.
#
# Part of https://github.com/<you>/surface-book-2-omarchy - MIT licensed.
[Unit]
StopWhenUnneeded=no

[Service]
Restart=always
RestartSec=2
